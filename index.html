<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Website</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>Welcome to the Professional Website</h1>
    </header>

    <main>
        <section id="about">
            <h2>About Us</h2>
            <p>This is a placeholder section for the About Us content.</p>
        </section>

        <section id="contact">
            <h2>Contact</h2>
            <form id="orderForm">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
                <label for="order">Order Details:</label>
                <textarea id="order" name="order" required></textarea>
                <button type="submit">Submit</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Professional Website</p>
    </footer>

    <!-- Chatbot placeholder -->
    <div id="chatbot">
        <button id="chatbotToggle">Chat</button>
        <div id="chatbotWindow">
            <p>Hi there! How can I help you?</p>
        </div>
    </div>
</body>
</html>
